<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0d0d0d">
<title>Painel | Life Activewear</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0d0d;--muted:#666;--line:#e3e3e3;--bg:#fff;--bg2:#f4f4f4;--ok:#1a7f4b;--warn:#b45309;--bad:#b42318;--side:232px;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Archivo,Arial,sans-serif;color:var(--ink);background:var(--bg2);line-height:1.5;font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
[hidden]{display:none!important}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:11px 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transition:background .2s,opacity .2s}
.btn:hover{background:#333}
.btn.line{background:#fff;color:var(--ink)}.btn.line:hover{background:var(--bg2)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:#fdeceb}
.btn.sm{padding:7px 11px;font-size:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-busy=true]{opacity:.6;pointer-events:none}
.link{background:none;border:0;padding:0;text-decoration:underline;font-size:12px;color:var(--ink)}
.link.bad{color:var(--bad)}

/* formulários */
.fld{display:grid;gap:6px;margin:0 0 14px}
.fld>label,.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#444}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:0;font-size:14px}
.in:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:repeat(3,1fr)}.row.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:700px){.row.c2,.row.c3,.row.c4{grid-template-columns:1fr}.in{font-size:16px}}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--line);padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #bbb;vertical-align:-2px;margin-right:6px}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:#cfcfcf;border-radius:22px;transition:background .2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:var(--ink)}.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.login .box{background:#fff;padding:36px 32px;width:100%;max-width:400px}
.login img{width:150px;display:block;margin:0 auto 24px}
.login h1{font-size:22px;text-transform:uppercase;text-align:center;margin-bottom:6px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 24px;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:0 0 10px}

/* layout */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 0}
.side .brand{padding:0 22px 22px;border-bottom:1px solid #2a2a2a}
.side .brand img{width:120px;display:block}
.side .brand small{display:block;margin-top:8px;font-size:10px;letter-spacing:.24em;color:#9a9a9a;text-transform:uppercase;font-weight:700}
.side nav{flex:1;padding:14px 10px;overflow:auto;display:grid;align-content:start;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#bdbdbd;border-left:2px solid transparent}
.side nav a:hover{color:#fff;background:#181818}
.side nav a.on{color:#fff;background:#1c1c1c;border-left-color:#fff}
.side nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .cnt{margin-left:auto;background:#fff;color:var(--ink);font-size:10px;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.side .foot{padding:14px 22px 0;border-top:1px solid #2a2a2a;font-size:12px;color:#9a9a9a;display:grid;gap:8px}
.side .foot .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot button,.side .foot a{background:none;border:0;padding:0;color:#fff;text-align:left;text-decoration:underline;font-size:12px}
.main{min-width:0;padding:28px 32px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(24px,3vw,34px);text-transform:uppercase;margin-top:8px}
.top .acts{display:flex;gap:10px;flex-wrap:wrap}
.mbar{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .25s;z-index:80}
  .side.open{transform:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:60}
  .mbar img{height:30px}.mbar button{background:none;border:0;color:#fff;padding:6px}
  .main{padding:20px 16px 60px}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
}

/* cartões e tabelas */
.card{background:#fff;border:1px solid var(--line);padding:20px;margin-bottom:18px}
.card>h2,.card .ch h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card .ch p{margin:4px 0 0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);padding:18px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:6px 0 2px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:hover td{background:#fafafa}
.t td.r,.t th.r{text-align:right}
.t .nm{font-weight:700}.t .sku{font-size:11px;color:var(--muted);letter-spacing:.06em}
.thumb{width:44px;height:58px;object-fit:cover;background:var(--bg2);display:block}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;background:var(--bg2);color:#444;white-space:nowrap}
.badge.ok{background:#e6f4ec;color:var(--ok)}.badge.warn{background:#fff4e0;color:#8a5200}.badge.bad{background:#fdeceb;color:var(--bad)}.badge.blue{background:#e8eefc;color:#274a9e}.badge.dark{background:var(--ink);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .in{width:auto;min-width:150px}.tools .grow{flex:1;min-width:200px}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}
@media(max-width:760px){
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{border:1px solid var(--line);margin-bottom:10px;padding:8px;background:#fff}
  table.t.cards td{border:0;padding:5px 4px;display:flex;justify-content:space-between;gap:10px;text-align:right}
  table.t.cards td::before{content:attr(data-l);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left}
  table.t.cards td.noL::before{display:none}
}
/* gráfico */
.bars{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--ink);padding-top:10px}
.bars .b{flex:1;min-width:3px;background:var(--ink);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars .b.z{background:#d8d8d8}
.bars .b:hover{background:#555}
.bars .b .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;white-space:nowrap;z-index:5;pointer-events:none}
.bars .b:hover .tip,.bars .b:focus .tip{display:block}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.hbar{display:grid;grid-template-columns:110px minmax(40px,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.hbar .tr{height:8px;background:var(--bg2)}.hbar .tr i{display:block;height:100%;background:var(--ink);border-radius:0 4px 4px 0}
.hbar b{text-align:right}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.mdl{background:#fff;width:100%;max-width:560px;position:relative}
.mdl.wide{max-width:1040px}
.mdl .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.mdl .mh h2{font-size:16px;text-transform:uppercase}
.mdl .mb{padding:22px}
.mdl .mf{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;z-index:3}
.x{background:none;border:0;font-size:22px;line-height:1;padding:4px 8px}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:300;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;padding:12px 16px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .25s}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
/* editor de produto */
.sec{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.sec:first-child{border-top:0;padding-top:0;margin-top:0}
.sec>h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.photos{display:flex;flex-wrap:wrap;gap:12px}
.ph{width:112px;border:1px solid var(--line);padding:6px;background:#fff;display:grid;gap:6px}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bg2)}
.ph .bt{display:flex;justify-content:space-between;gap:2px}
.ph .bt button{background:var(--bg2);border:0;padding:3px 6px;font-size:12px}
.ph .bt button:hover{background:var(--line)}
.ph.main{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ph .tg{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.addph{width:112px;min-height:150px;border:1px dashed #aaa;background:#fafafa;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:8px}
.addph:hover{border-color:var(--ink);color:var(--ink)}
.matrix{overflow-x:auto;margin-top:12px}
.matrix table{border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.matrix th{background:var(--bg2);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.matrix td.cn{text-align:left;font-weight:700;white-space:nowrap}
.matrix input[type=number]{width:70px;border:1px solid var(--line);padding:6px;text-align:center}
.matrix td.off input[type=number]{background:#f0f0f0;color:#999}
.matrix label{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.imgf{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.imgf .pv{width:84px;aspect-ratio:3/4;object-fit:cover;background:var(--bg2);border:1px solid var(--line)}
.imgf .ab{display:grid;gap:8px}
.rep{border:1px solid var(--line);padding:14px;margin-bottom:12px;background:#fafafa}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.gal button{border:1px solid var(--line);padding:4px;background:#fff}.gal button:hover{border-color:var(--ink)}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.pvw{display:grid;grid-template-columns:240px 1fr;gap:26px}
@media(max-width:700px){.pvw{grid-template-columns:1fr}}
.pvc img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bg2)}
.pvc .tag{display:inline-block;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;padding:4px 8px;text-transform:uppercase;margin:8px 0 0}
.pvc h4{margin:6px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.pvc s{color:#999;margin-left:8px;font-weight:400;font-size:12px}
.pvc .pix{font-size:13px}
.pvc .pix em{font-style:normal;font-size:10px;font-weight:700;background:var(--ink);color:#fff;padding:2px 6px}
.note{background:#fff8e6;border:1px solid #f2dca0;padding:10px 12px;font-size:12px;color:#6b4a00;margin:0 0 14px}
.note.info{background:#f2f6ff;border-color:#cdd9f5;color:#274a9e}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">Ative o JavaScript para usar o painel.</p></noscript>
<script src="/admin/admin.js"></script>
</body>
</html>
